name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  apk:
    name: Release APK (split per ABI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Informational: lints/warnings must not block the APK build, which is
      # the authoritative compile gate below.
      - name: Analyze
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../flutter-analyze.log

      - name: Build release APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee ../flutter-build.log

      - name: Publish build errors as issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = `Flutter build failed in [run ${context.runId}](${runUrl}).\n`;
            for (const log of ['flutter-analyze.log', 'flutter-build.log']) {
              try {
                const lines = fs.readFileSync(log, 'utf8').split('\n');
                const errors = [...new Set(lines.filter(l => /error|Error/.test(l)))].slice(0, 40);
                report += `\n## ${log}\n\`\`\`text\n` + (errors.join('\n') || lines.slice(-40).join('\n')) + '\n```\n';
              } catch (e) {
                report += `\n${log} not produced.\n`;
              }
            }
            const { owner, repo } = context.repo;
            const list = await github.rest.issues.listForRepo({ owner, repo, labels: 'ci-build-report', state: 'open', per_page: 1 });
            if (list.data.length > 0) {
              await github.rest.issues.update({ owner, repo, issue_number: list.data[0].number, body: report });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CI build failure report', body: report, labels: ['ci-build-report'] });
            }

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlassChat-Android-APKs
          path: android_flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-logs
          path: |
            flutter-analyze.log
            flutter-build.log
          if-no-files-found: ignore
