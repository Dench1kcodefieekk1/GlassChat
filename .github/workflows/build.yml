name: Build iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner image (must ship Xcode 26)"
        required: false
        default: "macos-26"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Archive & Export IPA
    runs-on: ${{ github.event.inputs.runner || 'macos-26' }}
    env:
      SCHEME: GlassChat
      PROJECT: GlassChat.xcodeproj
      BUNDLE_ID: com.glasschat.app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # Toolchain: pick the newest Xcode installed on the runner, then
      # install XcodeGen which generates GlassChat.xcodeproj from project.yml
      # ------------------------------------------------------------------
      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d "$PROJECT" || { echo "::error::$PROJECT was not generated"; exit 1; }
          echo "Generated $PROJECT"

      # ------------------------------------------------------------------
      # Decide build mode: signed (secrets present) vs unsigned (CI smoke)
      # ------------------------------------------------------------------
      - name: Detect signing configuration
        id: signing
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ] && [ -n "$TEAM_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=SIGNED_AD_HOC" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "mode=UNSIGNED_TEST" >> "$GITHUB_OUTPUT"
          fi
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}

      # ------------------------------------------------------------------
      # SIGNED PATH — produces an installable Ad Hoc IPA.
      # Requires the repository secrets documented in README.md.
      # ------------------------------------------------------------------
      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/glasschat-build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-options -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 -D \
            > "$PROFILES_DIR/$PROVISIONING_PROFILE_NAME.mobileprovision"
          echo "Profile installed at: $PROFILES_DIR/$PROVISIONING_PROFILE_NAME.mobileprovision"

      - name: Generate ExportOptions.plist
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive (signed)
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/GlassChat.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            archive 2>&1 | tee build-archive.log

      - name: Export signed IPA
        if: steps.signing.outputs.available == 'true'
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/GlassChat.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath export

      # ------------------------------------------------------------------
      # UNSIGNED PATH — no secrets needed. Verifies the project compiles
      # and packages on CI. The resulting IPA CANNOT be installed on a
      # physical iPhone (see README → PHYSICAL IPHONE mode).
      # ------------------------------------------------------------------
      - name: Archive (unsigned)
        if: steps.signing.outputs.available == 'false'
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/GlassChat.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build-archive.log

      - name: Package unsigned IPA
        if: steps.signing.outputs.available == 'false'
        run: |
          mkdir -p export/Payload
          cp -R "build/GlassChat.xcarchive/Products/Applications/GlassChat.app" export/Payload/
          cd export
          zip -qry GlassChat.ipa Payload

      - name: Extract build errors into summary
        if: failure()
        run: |
          if [ -f build-archive.log ]; then
            {
              echo "## Build errors"
              echo '```'
              grep -E "error:|error generated|Command .* failed" build-archive.log | sort -u | head -n 40 || true
              echo '```'
              echo ""
              echo "### Log tail"
              echo '```'
              tail -n 60 build-archive.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: build-archive.log
          if-no-files-found: ignore

      - name: Publish build errors as issue
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = `Build failed in [run ${context.runId}](${runUrl}).\n`;
            try {
              const log = fs.readFileSync('build-archive.log', 'utf8').split('\n');
              const errors = [...new Set(log.filter(l => /error:|error generated/.test(l)))].slice(0, 30);
              report += '\n## Errors\n```text\n' + (errors.join('\n') || '(no "error:" lines matched)') + '\n```\n';
              report += '\n<details><summary>Log tail</summary>\n\n```text\n' + log.slice(-60).join('\n') + '\n```\n\n</details>\n';
            } catch (e) {
              report += '\nNo `build-archive.log` was produced — the build failed before logging.\n';
            }
            const { owner, repo } = context.repo;
            const list = await github.rest.issues.listForRepo({ owner, repo, labels: 'ci-build-report', state: 'open', per_page: 1 });
            if (list.data.length > 0) {
              await github.rest.issues.update({ owner, repo, issue_number: list.data[0].number, body: report });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'CI build failure report', body: report, labels: ['ci-build-report'] });
            }

      # ------------------------------------------------------------------
      # Artifact
      # ------------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: GlassChat-iOS
          path: export/GlassChat.ipa
          if-no-files-found: error

      - name: Upload xcarchive (diagnostics)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: GlassChat-xcarchive
          path: build/GlassChat.xcarchive
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          {
            echo "## GlassChat build"
            echo ""
            echo "- Mode: **${{ steps.signing.outputs.mode }}**"
            echo "- Scheme: \`$SCHEME\` (Release)"
            echo "- Artifact: **GlassChat-iOS** → \`GlassChat.ipa\`"
            if [ "${{ steps.signing.outputs.available }}" = "false" ]; then
              echo ""
              echo "> Unsigned build: verifies compilation only. It cannot be installed on a physical iPhone."
              echo "> To get an installable IPA, add the signing secrets described in README.md (PHYSICAL IPHONE mode)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
