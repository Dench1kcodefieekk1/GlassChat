name: GlassChat
options:
  bundleIdPrefix: com.glasschat
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  GlassChat:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Folder-based source: XcodeGen automatically includes every Swift file
      # under GlassChat/ — including Services/AudioPlayerManager.swift (MusicManager),
      # Views/Profile/ProfileMusicSection.swift, Views/Chat/AudioMessageBubble.swift
      # and Views/Chat/DocumentPicker.swift.
      # Covers all Views/, Models/, Services/, Repositories/, ViewModels/, App/, Theme/.
      - path: GlassChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glasschat.app
        PRODUCT_NAME: GlassChat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: GlassChat
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "GlassChat uses the microphone to record voice messages."
        INFOPLIST_KEY_NSCameraUsageDescription: "GlassChat uses the camera to take photos you send in chats."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "GlassChat saves photos you choose to keep to your photo library."
        CODE_SIGN_STYLE: Automatic
  GlassChatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GlassChatTests
    dependencies:
      - target: GlassChat
