name: typ0k
options:
  bundleIdPrefix: com.typ0k
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  typ0k:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # Folder-based source: XcodeGen automatically includes every Swift file
      # under typ0k/ — including Services/AudioPlayerManager.swift (MusicManager),
      # Services/WalletManager.swift, Views/Profile/ProfileMusicSection.swift,
      # Views/Chat/AudioMessageBubble.swift and Views/Chat/DocumentPicker.swift.
      # Covers all Views/, Models/, Services/, Repositories/, ViewModels/, App/, Theme/.
      # GoogleService-Info.plist (Bundle ID com.typ0k.typ0kmessenger) lives in this
      # folder and is bundled as a resource automatically; replace the placeholder
      # values with a real Firebase project config to go live.
      - path: typ0k
    dependencies:
      - package: firebase
        product: FirebaseCore
      - package: firebase
        product: FirebaseAnalytics
      - package: firebase
        product: FirebaseAuth
      - package: firebase
        product: FirebaseFirestore
      - package: firebase
        product: FirebaseStorage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.typ0k.typ0kmessenger
        PRODUCT_NAME: typ0k
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: typ0k
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "typ0k uses the microphone to record voice messages."
        INFOPLIST_KEY_NSCameraUsageDescription: "typ0k uses the camera to take photos you send in chats."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "typ0k saves photos you choose to keep to your photo library."
        CODE_SIGN_STYLE: Automatic
  typ0kTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: typ0kTests
    dependencies:
      - target: typ0k
